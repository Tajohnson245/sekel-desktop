<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sekel-theme');
        var resolved = t === 'light' || t === 'dark'
          ? t
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(resolved);
      } catch (_) {}
    })();
  </script>
