<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Signup - Sekel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ededed;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #0a0a0a;
            padding-bottom: 40px;
        }

        .main {
            background-color: #111111;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            border-spacing: 0;
            color: #ededed;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-top: 40px;
        }

        .header {
            padding: 40px 0 20px 0;
            text-align: center;
        }

        .content {
            padding: 0 40px 40px 40px;
            text-align: center;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 20px 0;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: #3b82f6;
            /* Fallback for older clients */
        }

        p {
            font-size: 16px;
            line-height: 24px;
            color: #94a3b8;
            margin: 0 0 30px 0;
        }

        .button-container {
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }

        .gradient-underline {
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            width: 60px;
            margin: 0 auto 30px auto;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <table class="main">
            <tr>
                <td class="header">
                    <h1 style="font-size: 24px; font-weight: 800; margin: 0; color: #ffffff;">Sekel</h1>
                </td>
            </tr>
            <tr>
                <td class="content">
                    <div class="gradient-underline"></div>
                    <h2>Confirm your signup</h2>
                    <p>Welcome to the future of learning. Follow the link below to verify your email address and start
                        mastering your studies.</p>
                    <div class="button-container">
                        <a href="{{ .ConfirmationURL }}" class="btn">Confirm your email</a>
                    </div>
                    <p style="font-size: 14px; margin-top: 20px;">If you didn't create an account, you can safely ignore
                        this email.</p>
                </td>
            </tr>
        </table>
        <div class="footer">
            &copy; 2026 Sekel. Built for power learners.
        </div>
    </div>
</body>

</html>
