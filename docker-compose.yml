services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        TURBO_TEAM: ${TURBO_TEAM}
        TURBO_TOKEN: ${TURBO_TOKEN}
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env
    restart: unless-stopped

  community:
    build:
      context: .
      dockerfile: apps/community/Dockerfile
      args:
        TURBO_TEAM: ${TURBO_TEAM}
        TURBO_TOKEN: ${TURBO_TOKEN}
    ports:
      - "3001:3001"
    restart: unless-stopped