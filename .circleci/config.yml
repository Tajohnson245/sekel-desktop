version: 2.1

orbs:
  node: circleci/node@6.1
  win: circleci/windows@5.0

executors:
  linux-22:
    docker:
      - image: cimg/node:22.13
  linux-20:
    docker:
      - image: cimg/node:20.18
  macos-exec:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium

commands:
  install-deps:
    steps:
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:

  # ── Desktop: lint + typecheck (all branches) ─────────────────────────────
  desktop-lint-typecheck:
    executor: linux-22
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/desktop
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/desktop

  # ── Desktop: unit tests (all branches) ───────────────────────────────────
  desktop-unit-tests:
    executor: linux-22
    steps:
      - checkout
      - install-deps
      - run:
          name: Rebuild better-sqlite3
          command: npm rebuild better-sqlite3 --build-from-source
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Unit tests (desktop)
          command: npx turbo run test:unit --filter=@sekel/desktop
      - run:
          name: Component tests
          command: npx turbo run test --filter=@sekel/components

  # ── Desktop: platform builds (main + dev only) ───────────────────────────
  desktop-build-linux:
    executor: linux-22
    steps:
      - checkout
      - install-deps
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Build & package app
          command: npm run package
          working_directory: apps/desktop
      - store_artifacts:
          path: apps/desktop/out/Sekel-linux-x64
          destination: desktop-linux

  desktop-build-windows:
    executor:
      name: win/default
      size: medium
    steps:
      - checkout
      - run:
          name: Install Node.js 22
          command: |
            nvm install 22
            nvm use 22
            node --version
            npm --version
          shell: powershell.exe
      - run:
          name: Convert PNG to proper multi-size ICO
          command: |
            Add-Type -AssemblyName System.Drawing
            $src = [System.Drawing.Image]::FromFile("$PWD\apps\desktop\assets\sekel_logo_draft.png")
            $sizes = @(16, 32, 48, 64, 128, 256)
            $ico = "$PWD\apps\desktop\assets\sekel_logo.ico"
            $ms = New-Object System.IO.MemoryStream
            $bw = New-Object System.IO.BinaryWriter($ms)
            # ICO header
            $bw.Write([uint16]0)  # reserved
            $bw.Write([uint16]1)  # type: icon
            $bw.Write([uint16]$sizes.Count)
            # Render each size to PNG bytes
            $pngData = @()
            foreach ($s in $sizes) {
              $bmp = New-Object System.Drawing.Bitmap($src, $s, $s)
              $pms = New-Object System.IO.MemoryStream
              $bmp.Save($pms, [System.Drawing.Imaging.ImageFormat]::Png)
              $pngData += ,($pms.ToArray())
              $pms.Dispose()
              $bmp.Dispose()
            }
            # Directory entries (offset starts after header + all entries)
            $offset = 6 + ($sizes.Count * 16)
            for ($i = 0; $i -lt $sizes.Count; $i++) {
              $s = $sizes[$i]
              $w = if ($s -ge 256) { 0 } else { $s }
              $h = $w
              $bw.Write([byte]$w)       # width
              $bw.Write([byte]$h)       # height
              $bw.Write([byte]0)        # color palette
              $bw.Write([byte]0)        # reserved
              $bw.Write([uint16]1)      # color planes
              $bw.Write([uint16]32)     # bits per pixel
              $bw.Write([uint32]$pngData[$i].Length)  # size
              $bw.Write([uint32]$offset)              # offset
              $offset += $pngData[$i].Length
            }
            # Image data
            foreach ($d in $pngData) { $bw.Write($d) }
            $bw.Flush()
            [System.IO.File]::WriteAllBytes($ico, $ms.ToArray())
            $bw.Dispose()
            $ms.Dispose()
            $src.Dispose()
            Write-Host "Generated ICO with sizes: $($sizes -join ', ')"
          shell: powershell.exe
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Build & package installer
          command: npm run make
          working_directory: apps/desktop
      - store_artifacts:
          path: apps/desktop/out/make
          destination: desktop-windows

  desktop-build-macos:
    executor: macos-exec
    steps:
      - checkout
      - node/install:
          node-version: '22'
      - run:
          name: Generate .icns from PNG
          command: |
            ICONSET=apps/desktop/assets/sekel_logo.iconset
            mkdir -p "$ICONSET"
            SRC=apps/desktop/assets/sekel_logo_draft.png
            for SIZE in 16 32 128 256 512; do
              sips -z $SIZE $SIZE "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}.png" > /dev/null
              DOUBLE=$((SIZE * 2))
              sips -z $DOUBLE $DOUBLE "$SRC" --out "$ICONSET/icon_${SIZE}x${SIZE}@2x.png" > /dev/null
            done
            iconutil -c icns "$ICONSET" -o apps/desktop/assets/sekel_logo.icns
            rm -rf "$ICONSET"
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Build & package installer
          command: npm run make
          working_directory: apps/desktop
      - store_artifacts:
          path: apps/desktop/out/make
          destination: desktop-macos

  # ── Web (all branches) ───────────────────────────────────────────────────
  web-ci:
    executor: linux-20
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/web
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/web
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/web

  # ── Community (all branches) ─────────────────────────────────────────────
  community-ci:
    executor: linux-20
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/community
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/community
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/community

  # ── Survey (all branches) ────────────────────────────────────────────────
  survey-ci:
    executor: linux-20
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      ADMIN_EMAILS: ci@sekel.io
    steps:
      - checkout
      - install-deps
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/survey
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/survey
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/survey

workflows:
  ci:
    jobs:
      # Runs on every branch — fast feedback for PRs
      - desktop-lint-typecheck
      - desktop-unit-tests:
          requires:
            - desktop-lint-typecheck
      - web-ci
      - community-ci
      - survey-ci

      # Platform builds — main and dev only (expensive, release-gating)
      - desktop-build-linux:
          requires:
            - desktop-unit-tests
          filters:
            branches:
              only: [main, dev]
      - desktop-build-windows:
          requires:
            - desktop-unit-tests
          filters:
            branches:
              only: [main, dev]
      - desktop-build-macos:
          requires:
            - desktop-unit-tests
          filters:
            branches:
              only: [main, dev]
