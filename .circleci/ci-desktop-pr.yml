version: 2.1

orbs:
  node: circleci/node@6.1
  win: circleci/windows@5.0

executors:
  linux:
    docker:
      - image: cimg/node:22.13
  windows-exec:
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium
    shell: bash.exe
  macos-exec:
    macos:
      xcode: 15.4.0
    resource_class: macos.m1.medium.gen1

jobs:
  lint-typecheck:
    executor: linux
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/desktop

      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/desktop

  unit-tests:
    executor: linux
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-

      - run:
          name: Install dependencies
          command: npm ci

      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Rebuild better-sqlite3 for Node
          command: npm rebuild better-sqlite3

      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop

      - run:
          name: Unit tests (desktop)
          command: npx turbo run test:unit --filter=@sekel/desktop

      - run:
          name: Component tests
          command: npx turbo run test --filter=@sekel/components

  build-linux:
    executor: linux
    steps:
      - checkout

      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-

      - run:
          name: Install dependencies
          command: npm install

      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop

      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/desktop

  build-windows:
    executor: windows-exec
    steps:
      - checkout

      - node/install:
          node-version: '20'

      - run:
          name: Install dependencies
          command: npm install

      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop

      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/desktop

  build-macos:
    executor: macos-exec
    steps:
      - checkout

      - node/install:
          node-version: '20'

      - run:
          name: Install dependencies
          command: npm install

      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop

      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/desktop

workflows:
  ci-desktop-pr:
    jobs:
      - lint-typecheck
      - unit-tests:
          requires:
            - lint-typecheck
      - build-linux:
          requires:
            - lint-typecheck
      - build-windows:
          requires:
            - lint-typecheck
      - build-macos:
          requires:
            - lint-typecheck
