version: 2.1

orbs:
  node: circleci/node@6.1
  win: circleci/windows@5.0

executors:
  linux-22:
    docker:
      - image: cimg/node:22.13
  linux-20:
    docker:
      - image: cimg/node:20.18
  windows-exec:
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium
    shell: bash.exe
  macos-exec:
    macos:
      xcode: 15.4.0
    resource_class: macos.m1.medium.gen1

jobs:

  # ── Desktop ──────────────────────────────────────────────────────────

  desktop-lint-typecheck:
    executor: linux-22
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/desktop
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/desktop

  desktop-unit-tests:
    executor: linux-22
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Rebuild better-sqlite3 for Node
          command: npm rebuild better-sqlite3
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Unit tests (desktop)
          command: npx turbo run test:unit --filter=@sekel/desktop
      - run:
          name: Component tests
          command: npx turbo run test --filter=@sekel/components

  desktop-build-linux:
    executor: linux-22
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/desktop

  desktop-build-windows:
    executor: windows-exec
    steps:
      - checkout
      - node/install:
          node-version: '22'
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/desktop

  desktop-build-macos:
    executor: macos-exec
    steps:
      - checkout
      - node/install:
          node-version: '22'
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Install Rollup native binary
          command: npm install --no-save rollup
          working_directory: apps/desktop
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/desktop

  # ── Web ──────────────────────────────────────────────────────────────

  web-ci:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/web
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/web
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/web

  # ── Community ────────────────────────────────────────────────────────

  community-ci:
    docker:
      - image: cimg/node:20.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/community
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/community
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/community

  # ── Survey ───────────────────────────────────────────────────────────

  survey-ci:
    docker:
      - image: cimg/node:20.18
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      ADMIN_EMAILS: ci@sekel.io
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "package-lock.json" }}
            - npm-deps-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint
          command: npx turbo run lint --filter=@sekel/survey
      - run:
          name: Type check
          command: npx turbo run typecheck --filter=@sekel/survey
      - run:
          name: Build
          command: npx turbo run build --filter=@sekel/survey

workflows:

  ci-desktop-push:
    jobs:
      - desktop-lint-typecheck
      - desktop-unit-tests:
          requires:
            - desktop-lint-typecheck
      - desktop-build-linux:
          requires:
            - desktop-lint-typecheck
      - desktop-build-windows:
          requires:
            - desktop-lint-typecheck
      - desktop-build-macos:
          requires:
            - desktop-lint-typecheck

  ci-web-push:
    jobs:
      - web-ci

  ci-community-push:
    jobs:
      - community-ci

  ci-survey-push:
    jobs:
      - survey-ci
