name: CI — Web

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-web.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-web.yml'

jobs:
  web:
    name: Web — Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint --filter=@sekel/web

      - name: Type check
        run: npx turbo run typecheck --filter=@sekel/web

      - name: Build
        run: npx turbo run build --filter=@sekel/web
