name: CI — Desktop

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-desktop.yml'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint --filter=@sekel/desktop

      - name: Type check
        run: npx turbo run typecheck --filter=@sekel/desktop

  unit-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 is compiled for Electron's Node ABI in the lock file.
      # Rebuild it for the system Node.js so Vitest can load the native module.
      - name: Rebuild better-sqlite3 for Node
        run: npm rebuild better-sqlite3

      - name: Unit tests (desktop)
        run: npx turbo run test:unit --filter=@sekel/desktop

      - name: Component tests
        run: npx turbo run test --filter=@sekel/components

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [unit-tests, build]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Rollup native binary
        run: npm install --no-save rollup
        working-directory: apps/desktop

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium
        working-directory: apps/desktop

      - name: Build desktop app
        env:
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx turbo run build --filter=@sekel/desktop

      - name: Run Playwright E2E (xvfb virtual display for Electron on Linux)
        run: xvfb-run --auto-servernum -- npx playwright test
        working-directory: apps/desktop

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos
          path: apps/desktop/test-videos/
          retention-days: 7

  build:
    name: Build — ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # npm workspace bug: the root lock file (generated on Windows) doesn't include
      # platform-specific optional packages like @rollup/rollup-darwin-arm64.
      # Re-installing rollup scoped to the workspace forces npm to resolve and install
      # the native binary for the current runner's architecture.
      - name: Install Rollup native binary
        run: npm install --no-save rollup
        working-directory: apps/desktop

      # `build` runs electron-forge package (not make). `make` creates platform
      # installers requiring system tools (fakeroot, dpkg, rpm) — only needed for releases.
      - name: Build
        env:
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx turbo run build --filter=@sekel/desktop
