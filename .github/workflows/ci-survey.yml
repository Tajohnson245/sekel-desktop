name: CI — Survey

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/survey/**'
      - 'packages/survey-components/**'
      - 'packages/db/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-survey.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/survey/**'
      - 'packages/survey-components/**'
      - 'packages/db/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-survey.yml'

jobs:
  survey:
    name: Survey — Lint, Type Check & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAILS: ci@sekel.io
      NEXT_PUBLIC_APP_URL: http://localhost:3002

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint --filter=@sekel/survey

      - name: Type check
        run: npx turbo run typecheck --filter=@sekel/survey

      - name: Build
        run: npx turbo run build --filter=@sekel/survey
