name: Release (Desktop)

on:
  push:
    tags:
      - 'desktop/v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop/v}" >> $GITHUB_OUTPUT

      - name: Validate version matches version.json
        shell: bash
        run: |
          EXPECTED=$(node -p "require('./scripts/version.json').desktop")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$EXPECTED" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match version.json ($EXPECTED)"
            exit 1
          fi
          node scripts/bump.js --check

      - name: Install dependencies
        run: npm ci

      # Same cross-platform rollup fix as CI -- lock file generated on Windows
      # won't include platform-specific native binaries for macOS/Linux runners.
      - name: Install Rollup native binary
        run: npm install --no-save rollup
        working-directory: apps/desktop

      # Build and produce installer artifacts (unsigned). Windows artifacts get
      # signed in the next step by the official Azure Trusted Signing action.
      #
      # All env vars below are read by electron-vite's loadEnv() merge with
      # process.env (see apps/desktop/electron.vite.config.ts) and baked into
      # the main-process bundle via the define: block. The renderer picks up
      # VITE_-prefixed vars automatically through Vite's import.meta.env.
      - name: Build and make
        working-directory: apps/desktop
        env:
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORGE_ARCH: ${{ matrix.arch }}
        run: npm run make

      # Sign every Windows .exe under out/make using Azure Trusted Signing.
      # This is the SmartScreen-relevant artifact (Setup.exe). The action
      # downloads the Trusted Signing Dlib + invokes signtool.exe with /dlib.
      - name: Sign Windows installers (Windows only)
        if: matrix.os == 'windows-latest'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: sekel-signing
          certificate-profile-name: sekel-public
          files-folder: ${{ github.workspace }}/apps/desktop/out/make
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      # Create the draft GitHub Release if it doesn't exist yet (idempotent
      # across matrix jobs -- whichever runs first wins, others no-op).
      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "" || \
              gh release view "$TAG" >/dev/null  # tolerate race -- another job created it
          fi

      # Upload all installer artifacts to the draft GitHub Release.
      # --clobber is safe across matrix jobs and re-runs.
      - name: Upload artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ steps.version.outputs.version }}"
          cd apps/desktop/out/make
          # Find every artifact electron-forge produced and upload it.
          find . -type f \
            \( -name "*.exe" -o -name "*.zip" -o -name "*.nupkg" \
               -o -name "RELEASES" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.dmg" \) \
            -print0 | while IFS= read -r -d '' f; do
              echo "Uploading $f"
              gh release upload "$TAG" "$f" --clobber
            done

      # Upload to Cloudflare R2 with the same per-platform/per-arch layout
      # the prior publisher-s3 keyResolver produced: <platform>/<arch>/<filename>.
      - name: Upload artifacts to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -e
          PLATFORM=$(node -p "process.platform")  # win32 | darwin | linux
          ARCH="${{ matrix.arch }}"
          ENDPOINT="https://10b526ce06de458a7e43834f97953694.r2.cloudflarestorage.com"
          cd apps/desktop/out/make
          find . -type f \
            \( -name "*.exe" -o -name "*.zip" -o -name "*.nupkg" \
               -o -name "RELEASES" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.dmg" \) \
            -print0 | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              echo "Uploading $f -> s3://sekel-releases/$PLATFORM/$ARCH/$base"
              aws s3 cp "$f" "s3://sekel-releases/$PLATFORM/$ARCH/$base" \
                --endpoint-url "$ENDPOINT"
            done

  # Runs once after every matrix combo has uploaded artifacts. Composes the
  # release body from PR titles and commit subjects via the GitHub
  # generate-notes API, then flips the draft flag to published. The desktop
  # client's update modal fetches this body at update-downloaded time.
  # (Wired so an AI summarizer can be swapped in later without touching
  # the modal.)
  #
  # NOTE: gh release edit does not support --generate-notes (only gh release
  # create does), so we call the GitHub API directly and pass the result via
  # --notes-file. See https://cli.github.com/manual/gh_release_edit.
  publish-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          # release.yml's earlier steps create the GitHub Release with tag
          # name v${version} (not desktop/v${version}) — see "Ensure GitHub
          # Release exists" above.
          TAG="v${GITHUB_REF_NAME#desktop/v}"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body' > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release $TAG" > /tmp/release_notes.md
          fi
          echo "::group::Generated notes"
          cat /tmp/release_notes.md
          echo "::endgroup::"
          gh release edit "$TAG" --draft=false --notes-file /tmp/release_notes.md
