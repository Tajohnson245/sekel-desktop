name: Release (Desktop)

on:
  push:
    tags:
      - 'desktop/v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop/v}" >> $GITHUB_OUTPUT

      - name: Validate version matches version.json
        shell: bash
        run: |
          EXPECTED=$(node -p "require('./scripts/version.json').desktop")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$EXPECTED" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match version.json ($EXPECTED)"
            exit 1
          fi
          node scripts/bump.js --check

      - name: Install dependencies
        run: npm ci

      # Same cross-platform rollup fix as CI — lock file generated on Windows
      # won't include platform-specific native binaries for macOS/Linux runners.
      - name: Install Rollup native binary
        run: npm install --no-save rollup
        working-directory: apps/desktop

      - name: Build and publish
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FORGE_ARCH: ${{ matrix.arch }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: npm run publish

  # Runs once after every matrix combo has uploaded artifacts. Uses GitHub's
  # built-in --generate-notes to compose the release body from PR titles and
  # commit subjects in the range, then flips the draft flag to published.
  # The desktop client's update modal fetches this body at update-downloaded
  # time. (Wired to allow swapping in an AI summarizer later without touching
  # the modal.)
  publish-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish release with auto-generated notes
        env:
          # publisher-github creates the release on Tajohnson245/sekel (see
          # apps/desktop/forge.config.js publishers[0].config.repository).
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: Tajohnson245/sekel
        shell: bash
        run: |
          set -e
          TAG="v${GITHUB_REF_NAME#desktop/v}"
          gh release edit "$TAG" --draft=false --generate-notes
