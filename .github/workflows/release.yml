name: Release (Desktop)

on:
  push:
    tags:
      - 'desktop/v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop/v}" >> $GITHUB_OUTPUT

      - name: Validate version matches version.json
        shell: bash
        run: |
          EXPECTED=$(node -p "require('./scripts/version.json').desktop")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$EXPECTED" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match version.json ($EXPECTED)"
            exit 1
          fi
          node scripts/bump.js --check

      - name: Install dependencies
        run: npm ci

      # Same cross-platform rollup fix as CI — lock file generated on Windows
      # won't include platform-specific native binaries for macOS/Linux runners.
      - name: Install Rollup native binary
        run: npm install --no-save rollup
        working-directory: apps/desktop

      - name: Build and publish
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run publish -- --arch=${{ matrix.arch }}
