name: Release (Desktop)

on:
  push:
    tags:
      - 'desktop/v*.*.*'

permissions:
  contents: write

jobs:
  # Apply pending migrations + deploy edge functions to the prod Supabase
  # project BEFORE the desktop installer is built and uploaded. This couples
  # the server schema/functions to the client release: by the time the new
  # installer is on R2 and users start auto-updating, prod is already on the
  # matching schema.
  #
  # Caveat: there is a small window (minutes between this job finishing and
  # users actually auto-updating) where the prod schema is ahead of clients
  # still on the previous release. For tightening migrations (NOT NULL,
  # CHECK), prefer the expand-then-contract pattern: this release adds the
  # column nullable; a later release tightens it once the new client is
  # rolled out.
  #
  # Required GitHub secrets:
  #   - SUPABASE_ACCESS_TOKEN     personal access token from
  #                               https://supabase.com/dashboard/account/tokens
  #   - SUPABASE_PROD_DB_PASSWORD database password for the prod project
  #                               (Settings → Database → Connection string)
  deploy-server:
    name: Deploy server-side (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to prod project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        working-directory: apps/desktop
        run: supabase link --project-ref uawkoueqectmkiyjcrtb

      - name: List pending migrations (informational)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: apps/desktop
        run: supabase migration list

      - name: Apply prod migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: apps/desktop
        run: supabase db push --linked --yes

      # Run after migrations so the seeder writes against the freshly-applied
      # schema. Idempotent — every blueprint file uses upsert semantics, so
      # re-running on each release is safe and self-healing if a previous run
      # was missed.
      - name: Setup Node for seeders
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (root + workspaces)
        run: npm ci

      - name: Seed blueprints to prod Supabase
        env:
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/seed-blueprints-supabase.ts

      - name: Deploy feedback-discord edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: apps/desktop
        run: supabase functions deploy feedback-discord --project-ref uawkoueqectmkiyjcrtb --no-verify-jwt

      - name: Deploy feedback-email edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: apps/desktop
        run: supabase functions deploy feedback-email --project-ref uawkoueqectmkiyjcrtb --no-verify-jwt

  release:
    needs: deploy-server
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop/v}" >> $GITHUB_OUTPUT

      - name: Validate version matches version.json
        shell: bash
        run: |
          EXPECTED=$(node -p "require('./scripts/version.json').desktop")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$EXPECTED" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match version.json ($EXPECTED)"
            exit 1
          fi
          node scripts/bump.js --check

      - name: Install dependencies
        run: npm ci

      # Same cross-platform rollup fix as CI -- lock file generated on Windows
      # won't include platform-specific native binaries for macOS/Linux runners.
      - name: Install Rollup native binary
        run: npm install --no-save rollup
        working-directory: apps/desktop

      # Build and produce installer artifacts (unsigned). Windows artifacts get
      # signed in the next step by the official Azure Trusted Signing action.
      #
      # All env vars below are read by electron-vite's loadEnv() merge with
      # process.env (see apps/desktop/electron.vite.config.ts) and baked into
      # the main-process bundle via the define: block. The renderer picks up
      # VITE_-prefixed vars automatically through Vite's import.meta.env.
      - name: Build and make
        working-directory: apps/desktop
        env:
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORGE_ARCH: ${{ matrix.arch }}
        run: npm run make

      # Sign every Windows .exe under out/make using Azure Trusted Signing.
      # This is the SmartScreen-relevant artifact (Setup.exe). The action
      # downloads the Trusted Signing Dlib + invokes signtool.exe with /dlib.
      - name: Sign Windows installers (Windows only)
        if: matrix.os == 'windows-latest'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: sekel-signing
          certificate-profile-name: sekel-public
          files-folder: ${{ github.workspace }}/apps/desktop/out/make
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      # Create the draft GitHub Release if it doesn't exist yet (idempotent
      # across matrix jobs -- whichever runs first wins, others no-op).
      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "" || \
              gh release view "$TAG" >/dev/null  # tolerate race -- another job created it
          fi

      # Upload all installer artifacts to the draft GitHub Release.
      # --clobber is safe across matrix jobs and re-runs.
      - name: Upload artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v${{ steps.version.outputs.version }}"
          cd apps/desktop/out/make
          # Find every artifact electron-forge produced and upload it.
          find . -type f \
            \( -name "*.exe" -o -name "*.zip" -o -name "*.nupkg" \
               -o -name "RELEASES" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.dmg" \) \
            -print0 | while IFS= read -r -d '' f; do
              echo "Uploading $f"
              gh release upload "$TAG" "$f" --clobber
            done

      # Upload to Cloudflare R2 with the same per-platform/per-arch layout
      # the prior publisher-s3 keyResolver produced: <platform>/<arch>/<filename>.
      - name: Upload artifacts to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -e
          PLATFORM=$(node -p "process.platform")  # win32 | darwin | linux
          ARCH="${{ matrix.arch }}"
          ENDPOINT="https://10b526ce06de458a7e43834f97953694.r2.cloudflarestorage.com"
          cd apps/desktop/out/make
          find . -type f \
            \( -name "*.exe" -o -name "*.zip" -o -name "*.nupkg" \
               -o -name "RELEASES" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.dmg" \) \
            -print0 | while IFS= read -r -d '' f; do
              base=$(basename "$f")
              echo "Uploading $f -> s3://sekel-releases/$PLATFORM/$ARCH/$base"
              aws s3 cp "$f" "s3://sekel-releases/$PLATFORM/$ARCH/$base" \
                --endpoint-url "$ENDPOINT"
            done

  # Two distinct audiences, two distinct outputs:
  #   1. The GitHub Release page (engineers / maintainers): keeps the
  #      auto-generated notes from PR titles via gh api generate-notes —
  #      perfect for browsing what shipped at the commit/PR level.
  #   2. The desktop auto-update modal (end users): reads a R2 mirror at
  #      pub-...r2.dev/notes/v${version}.md. We populate that mirror with
  #      the curated `## [X.Y.Z]` section from CHANGELOG.md, which is
  #      hand-written for users on each release branch.
  #
  # If CHANGELOG extraction returns empty (release didn't update CHANGELOG),
  # we fall back to the auto-generated notes so users still see *something*.
  #
  # NOTE: gh release edit does not support --generate-notes (only gh release
  # create does), so we call the GitHub API directly for the auto notes and
  # pass the result via --notes-file.
  publish-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Need the working tree to read CHANGELOG.md. Check out the tagged
      # commit (release-branch state at version bump) so the CHANGELOG entry
      # written on the release branch is present — main may not have been
      # merged yet at this point in the flow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Publish release with auto-generated notes (GitHub Releases page)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          # release.yml's earlier steps create the GitHub Release with tag
          # name v${version} (not desktop/v${version}) — see "Ensure GitHub
          # Release exists" above.
          TAG="v${GITHUB_REF_NAME#desktop/v}"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body' > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release $TAG" > /tmp/release_notes.md
          fi
          echo "::group::GitHub auto-generated notes"
          cat /tmp/release_notes.md
          echo "::endgroup::"
          gh release edit "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --draft=false \
            --notes-file /tmp/release_notes.md

      - name: Extract user-facing notes from CHANGELOG.md
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#desktop/v}"
          # Match the version's section header (e.g. "## [1.0.8] - 2026-05-09")
          # and print everything until the next "## [" header (or EOF).
          awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/user_release_notes.md

          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' /tmp/user_release_notes.md || true

          if [ ! -s /tmp/user_release_notes.md ]; then
            echo "WARN: No CHANGELOG section for v$VERSION; falling back to GitHub auto-notes"
            cp /tmp/release_notes.md /tmp/user_release_notes.md
          fi

          echo "::group::User-facing notes (mirrored to R2)"
          cat /tmp/user_release_notes.md
          echo "::endgroup::"

      # Mirror the user-facing notes to R2 so the desktop auto-update modal
      # can read them. Repo is private, so anonymous github.com calls 404 —
      # R2 is publicly readable (same bucket as installers), so the modal
      # fetches https://pub-1dd00656fa304302a2db06169963ac20.r2.dev/notes/v${version}.md
      # without any auth.
      - name: Mirror user-facing notes to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          set -e
          TAG="v${GITHUB_REF_NAME#desktop/v}"
          ENDPOINT="https://10b526ce06de458a7e43834f97953694.r2.cloudflarestorage.com"
          echo "Uploading /tmp/user_release_notes.md -> s3://sekel-releases/notes/$TAG.md"
          aws s3 cp /tmp/user_release_notes.md "s3://sekel-releases/notes/$TAG.md" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "public, max-age=300"
