name: Release (Desktop)

on:
  push:
    tags:
      - 'desktop/v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop/v}" >> $GITHUB_OUTPUT

      - name: Validate version matches version.json
        shell: bash
        run: |
          EXPECTED=$(node -p "require('./scripts/version.json').desktop")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$EXPECTED" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match version.json ($EXPECTED)"
            exit 1
          fi
          node scripts/bump.js --check

      - name: Install dependencies
        run: npm ci

      # Same cross-platform rollup fix as CI — lock file generated on Windows
      # won't include platform-specific native binaries for macOS/Linux runners.
      - name: Install Rollup native binary
        run: npm install --no-save rollup
        working-directory: apps/desktop

      # Windows-only: install AzureSignTool for Azure Artifact Signing.
      # The signing hook in apps/desktop/sign-azure.js shells out to this CLI.
      - name: Install AzureSignTool (Windows only)
        if: matrix.os == 'windows-latest'
        run: dotnet tool install --global AzureSignTool

      - name: Build and publish
        working-directory: apps/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_PROJECT_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          FORGE_ARCH: ${{ matrix.arch }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          # Azure Artifact Signing — consumed by apps/desktop/sign-azure.js on Windows.
          # Add these as repo-level GitHub Secrets before the next desktop/v* tag push.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run publish
