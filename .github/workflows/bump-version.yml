name: Bump Version

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to bump'
        required: true
        type: choice
        options:
          - desktop
      version:
        description: 'New version (e.g. 1.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: Bump ${{ inputs.app }} to v${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid version format '${{ inputs.version }}'. Expected X.Y.Z"
            exit 1
          fi

      - name: Bump version
        run: node scripts/bump.js ${{ inputs.app }} ${{ inputs.version }}

      - name: Verify bump
        run: node scripts/bump.js --check

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(${{ inputs.app }}): bump version to ${{ inputs.version }}"
          git tag -a "${{ inputs.app }}/v${{ inputs.version }}" -m "Release ${{ inputs.app }} v${{ inputs.version }}"

      - name: Push commit and tag
        run: |
          git push origin HEAD
          git push origin "${{ inputs.app }}/v${{ inputs.version }}"
